# Atualização automática dos produtos (Mais Vendidos + Black Friday)
# Publica as mudanças via push, o que dispara o deploy automático na Vercel.
#
# Por que 5 disparos por dia? O GitHub atrasa (ou chega a pular) crons de
# repositórios com baixa atividade — em 11/11 e 12/11/2026 o cron das 06:00
# só disparou às ~14:20 e em 13/11 não disparou de manhã nenhuma. Com
# janelas espalhadas às 06:00, 06:35, 09:30, 13:00 e 16:30 (BRT) garante
# que pelo menos um disparo caia em horário comercial todos os dias.
# O script é idempotente: se não houve mudança de preço/ranking, ele não
# gera commit nem deploy.
name: Atualização diária de produtos

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC = 06:00 (horário de Brasília)
    - cron: '35 9 * * *' # 09:35 UTC = 06:35 (rede de segurança imediata)
    - cron: '30 12 * * *' # 12:30 UTC = 09:30 BRT (rede de segurança)
    - cron: '0 16 * * *' # 16:00 UTC = 13:00 BRT (tarda do dia)
    - cron: '30 19 * * *' # 19:30 UTC = 16:30 BRT (última janela do dia)
  workflow_dispatch: # permite rodar manualmente pelo painel do GitHub

permissions:
  contents: write

# Evita execuções simultâneas disputando o mesmo push
concurrency:
  group: atualizar-produtos
  cancel-in-progress: false

jobs:
  update-products:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Atualizar products.json no Mercado Livre
        # Se o Mercado Livre bloquear ou a marcação mudar, o script falha
        # (exit != 0) e NADA é publicado — o site mantém os últimos dados bons.
        run: node scripts/update-products.js

      - name: Publicar mudanças (dispara deploy na Vercel)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
          else
            git commit -m "chore: atualiza preços e rankings ($(date -u +%d/%m/%Y))"
            git push
          fi
